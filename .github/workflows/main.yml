# Builds installable Kibana plugin zips on GitHub's servers — one zip per plugin folder.
#
#   status_grid/       → statusGrid-<version>.zip
#   dashboard_header/  → dashboardHeader-<version>.zip
#
# Runs automatically on every push to main that changes a plugin, or manually:
# GitHub repo → Actions → "Build Kibana plugin" → Run workflow.
#
# Download: open the finished run → Artifacts. GitHub wraps each artifact in its own zip,
# so unzip the download once; the zip inside is the file you install with kibana-plugin.

name: Build Kibana plugin

on:
  workflow_dispatch:
    inputs:
      kibana_version:
        description: Kibana version to build for (must match your Kibana exactly)
        required: true
        default: 9.5.4
  push:
    tags: ['v*']
    branches: [main]
    paths: ['status_grid/**', 'dashboard_header/**', '.github/workflows/**']

permissions:
  contents: write # needed only to attach zips to a release on tag pushes

env:
  KIBANA_VERSION: ${{ inputs.kibana_version || '9.5.4' }}
  # Space-separated plugin folders in this repo. Kibana is bootstrapped once and all are built.
  PLUGIN_DIRS: status_grid dashboard_header

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4
        with:
          path: plugin-src

      # Kibana's dependencies need far more disk than a runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      # Extra memory headroom; the Kibana bootstrap and optimizer are memory hungry.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Check out Kibana v${{ env.KIBANA_VERSION }}
        run: git clone --depth 1 --branch "v${KIBANA_VERSION}" https://github.com/elastic/kibana.git kibana

      - name: Set up Node (version from Kibana's .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: kibana/.nvmrc

      # Kibana 9.5.4 and earlier use yarn; 9.5.6 and later use pnpm. Corepack picks the right one.
      - name: Detect package manager
        id: pm
        working-directory: kibana
        run: |
          corepack enable
          PM=$(node -p "(require('./package.json').packageManager || 'yarn@1').split('@')[0]")
          echo "Kibana uses: $PM"
          echo "pm=$PM" >> "$GITHUB_OUTPUT"

      - name: Copy plugins into Kibana
        run: |
          for dir in $PLUGIN_DIRS; do
            mkdir -p "kibana/plugins/$dir"
            rsync -a --exclude build --exclude node_modules "plugin-src/$dir/" "kibana/plugins/$dir/"
            echo "== $dir"; ls "kibana/plugins/$dir"
          done

      - name: Bootstrap Kibana (slow)
        working-directory: kibana
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: ${{ steps.pm.outputs.pm }} kbn bootstrap

      - name: Build plugin zips
        working-directory: kibana/plugins
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          for dir in $PLUGIN_DIRS; do
            echo "::group::Build $dir"
            (cd "$dir" && node ../../scripts/plugin_helpers build --kibana-version "${KIBANA_VERSION}")
            cp "$dir"/build/*.zip "$GITHUB_WORKSPACE/out/"
            echo "::endgroup::"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload statusGrid zip
        uses: actions/upload-artifact@v4
        with:
          name: statusGrid-${{ env.KIBANA_VERSION }}
          path: out/statusGrid-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload dashboardHeader zip
        uses: actions/upload-artifact@v4
        with:
          name: dashboardHeader-${{ env.KIBANA_VERSION }}
          path: out/dashboardHeader-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zips to release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
